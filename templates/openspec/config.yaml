schema: spec-driven
version: 13.0.0
context: |
  ## 语言
  所有交互使用中文。OpenSpec 英文标题保留。

  ## 工作模式
  aspec 寄生于 OpenSpec，通过 context/rules 注入增强。
  核心理念：对齐优先于效率。

  ## 流程
  [需求澄清→对齐] → proposal → specs → [设计澄清→对齐] → design.md → [审批] → tasks → apply → [经验提取] → archive

  ## 门禁（不可跳过）
  | 产物 | 前置条件 |
  |------|----------|
  | proposal | issues/requirement-issues.md 已澄清 + 对齐确认通过 |
  | design.md | issues/design-issues.md 已澄清 + 对齐确认通过 |
  | tasks | 用户审批 design.md |

  ## 对齐协议
  需求澄清和设计澄清均引用 shared/alignment-protocol.md 执行。
  额外输入：Read dimensions.md 获取维度深度提问和盲区表。

  ## 惊讶测试
  替用户做选择时，若用户看到会惊讶 → 暂停展示选项（AskUserQuestion）。

  ## 并行探索
  分析维度 ≥3 个且独立时，引用 shared/parallel-protocol.md 并行探索。
  约束：并行 Agent ≤4，不修改同一文件。

  ## 文件约定
  - 需求问题：issues/requirement-issues.md（id, description, severity, status, answer）
  - 设计问题：issues/design-issues.md（id, description, severity, status, decision, rationale）
  - 实施观察：spec/notes.md（需求意外 / 设计意外 / 好的实践 / 风险事件）
  - 项目经验：experience.md（结构见 experience-template.md）

  ## Spec 质量标准
  - proposal：每个 Capability 有明确边界和可测试验收条件
  - design：每个 High 决策含选择、理由、备选方案、排除原因
  - tasks：可独立验证，可追溯到 design 决策

  ## 经验进化
  跨会话知识积累体系。钩子在 rules 中声明，结构由 experience-template.md 定义。
  应用经验时告知用户（"基于经验 EX，建议..."）。验证：✓有效 / ✗无效 / —不适用。

rules:
  proposal:
    - "[PRE] Read experience.md 需求相关经验，告知用户"
    - |
      [PRE] 需求澄清（三步）：
      1. Read dimensions.md + Read shared/alignment-protocol.md
      2. 内部深度分析（苏格拉底四追问 + 维度深度提问 + 盲区表验证）→ 结论写入 issues/requirement-issues.md
      3. 按 alignment-protocol Step 2/3 执行引导性澄清和对齐确认
      若分析维度 ≥3 个且独立 → Read shared/parallel-protocol.md 并行探索
    - "🚫 GATE: issues 未澄清 + 对齐未通过前，禁止创建 proposal"

  specs:
    - "[CONSTRAINT] 须与已澄清需求一致，变更须记录原因"

  design:
    - "[PRE] Read experience.md 技术相关经验，告知用户"
    - |
      [PRE] 设计澄清（三步）：
      1. Read dimensions.md 设计维度 + Read shared/alignment-protocol.md
      2. 内部深度分析（苏格拉底四追问 + 设计维度深度提问 + 盲区表验证）→ 结论写入 issues/design-issues.md
      3. 按 alignment-protocol Step 2/3 执行引导性澄清和对齐确认
      若需评估多个备选方案 → Read shared/parallel-protocol.md 并行调研
    - "🚫 GATE: issues 未澄清 + 对齐未通过前，禁止创建 design.md"

  tasks:
    - "[PRE] 展示 design.md 核心摘要，通过 AskUserQuestion 获得审批后创建任务"
    - |
      [CONSTRAINT] tasks.md 末尾必须包含收尾段：
      ## 收尾（代码任务全部完成后执行）
      > 经验规范见 shared/experience-protocol.md
      - [ ] 复盘：对照 design.md 检查实施偏差 → spec/notes.md
      - [ ] 经验提取：Read shared/experience-protocol.md 执行
      - [ ] 经验验证：标记本次应用的历史经验（✓/✗/—）
      - [ ] 经验收敛：>20 条则提议合并/淘汰（需用户确认）
      - [ ] 归档确认：通过 AskUserQuestion 询问用户
    - "[POST] 通过 AskUserQuestion 询问是否立即实施"

  apply:
    - "[PRE] 读取 issues/ 下决策文件，遵循所有已澄清决策"
    - "[CONSTRAINT] 新问题暂停评估记录到 spec/notes.md；代码与 design.md 偏差须记录理由"
    - "[POST] Read shared/verification-protocol.md 验证 Spec-Code 一致性"

  archive: []
