schema: spec-driven
version: 14.0.0
context: |
  ## 语言
  所有交互使用中文。OpenSpec 英文标题保留。

  ## 工作模式
  aspec 寄生于 OpenSpec，通过 context/rules 注入增强。
  核心理念：对齐优先于效率。

  ## 流程
  [需求澄清→对齐] → proposal → specs → [设计澄清→对齐] → design.md → [审批] → tasks → apply → [经验提取] → archive

  ## 门禁（不可跳过）
  | 产物 | 前置条件 |
  |------|----------|
  | proposal | issues/requirement-issues.md 已澄清 + 对齐确认通过 |
  | design.md | issues/design-issues.md 已澄清 + 对齐确认通过 |
  | tasks | 用户审批 design.md |

  ## 对齐协议
  ACE 协议文件统一位于插件目录：~/.claude/plugins/marketplaces/ace-local/shared/
  需求澄清和设计澄清均引用该目录下 alignment-protocol.md 执行。
  额外输入：Read openspec/templates/dimensions.md 获取维度深度提问和盲区表。

  ## 惊讶测试
  替用户做选择时，若用户看到会惊讶 → 暂停展示选项（AskUserQuestion）。

  ## 并行探索 [CONSTRAINT]
  分析维度 ≥3 个且相互独立时，必须在单条 response 中并行发出 ≤8 个 Agent 调用。串行执行等价于违规。
  引用：~/.claude/plugins/marketplaces/ace-local/shared/parallel-protocol.md
  约束：并行 Agent ≤8，不修改同一文件。

  ## 文件约定
  Change 内文件（相对于当前 change 目录）：
  - 需求问题：issues/requirement-issues.md（id, description, severity, status, answer）
  - 设计问题：issues/design-issues.md（id, description, severity, status, decision, rationale）
  - 实施观察：notes.md（需求意外 / 设计意外 / 好的实践 / 风险事件）

  项目级文件（相对于项目根目录，跨 change 共享）：
  - 项目经验：openspec/experience.md（E{N} 格式，⚠️不在 change 目录下）

  ## Spec 质量标准
  - proposal：每个 Capability 有明确边界和可测试验收条件
  - design：每个 High 决策含选择、理由、备选方案、排除原因
  - tasks：可独立验证，可追溯到 design 决策

  ## 经验进化
  项目经验统一存储于 openspec/experience.md，格式为 E{N}。
  跨 change、跨工作流共享。钩子在 rules 中声明。
  应用经验时告知用户（"基于经验 E{N}，采用..."）。验证：✓有效 / ✗无效 / —不适用。

rules:
  proposal:
    - "[PRE] Read openspec/experience.md 需求相关经验，告知用户"
    - |
      [PRE] 需求澄清（三步）：
      1. Read openspec/templates/dimensions.md + Read ~/.claude/plugins/marketplaces/ace-local/shared/alignment-protocol.md
      2. 内部深度分析（苏格拉底四追问 + 维度深度提问 + 盲区表验证）→ 结论写入 issues/requirement-issues.md
      3. 按 alignment-protocol Step 2/3 执行引导性澄清和对齐确认
    - |
      [CONSTRAINT] 并行探索：步骤 2 内部深度分析探索时，必须在单条 response 中并行发出 多个 SubAgent 调用去并行深度分析和探索。
      串行逐维度分析 = 违规。HOW → Read parallel-protocol.md。
    - "🚫 GATE: issues 未澄清 + 对齐未通过前，禁止创建 proposal"

  specs:
    - "[CONSTRAINT] 须与已澄清需求一致，变更须记录原因"

  design:
    - "[PRE] Read openspec/experience.md 技术相关经验，告知用户"
    - |
      [PRE] 设计澄清（三步）：
      1. Read openspec/templates/dimensions.md 设计维度 + Read ~/.claude/plugins/marketplaces/ace-local/shared/alignment-protocol.md
      2. 内部深度分析（苏格拉底四追问 + 设计维度深度提问 + 盲区表验证）→ 结论写入 issues/design-issues.md
      3. 按 alignment-protocol Step 2/3 执行引导性澄清和对齐确认
    - |
      [CONSTRAINT] 并行探索：步骤 2 内部深度分析探索时，必须在单条 response 中并行发出 多个 SubAgent 调用去并行深度分析和探索。
      串行逐维度分析 = 违规。HOW → Read parallel-protocol.md。
    - "🚫 GATE: issues 未澄清 + 对齐未通过前，禁止创建 design.md"

  tasks:
    - "[PRE] 展示 design.md 核心摘要，通过 AskUserQuestion 获得审批后创建任务"
    - |
      [CONSTRAINT] tasks.md 最后一组任务必须是质量收尾（使用连续编号），格式如下：
      ## {N+1}. 质量收尾（⚠️ 必须执行，不可跳过）

      - [ ] {N+1}.1 复盘 — 对照 design.md 检查实施偏差，将结果写入 notes.md
      - [ ] {N+1}.2 经验提取 — Read ~/.claude/plugins/marketplaces/ace-local/shared/experience-protocol.md 并执行
      - [ ] {N+1}.3 经验验证 — 标记本次应用的历史经验（✓/✗/—）
      - [ ] {N+1}.4 经验收敛 — 若 >20 条则提议合并/淘汰（需用户确认）
      - [ ] {N+1}.5 归档确认 — 通过 AskUserQuestion 询问用户是否归档

      规则：
      - {N+1} 必须是前一组编号的自然续号（如前一组是 ## 5，这组就是 ## 6）
      - 使用与代码任务完全相同的 checkbox + 编号格式
      - 不得使用 > 引用块或独立段落标记
    - "[POST] 通过 AskUserQuestion 询问是否立即实施"

  apply:
    - "[PRE] 读取 issues/ 下决策文件，遵循所有已澄清决策"
    - "[CONSTRAINT] 新问题暂停评估记录到 notes.md；代码与 design.md 偏差须记录理由"
    - |
      [CONSTRAINT] 并行实施（两个触发点）：
      1. 代码理解阶段（读取 tasks.md 后、动手实现前）：需分析 ≥3 个独立类/模块时，
         必须并行 Agent 探索，每个 Agent 分析一个目标并返回结构摘要。
      2. 任务实现阶段：≥2 个 task 修改不同文件且无依赖时，必须并行 Agent 实现。
      串行执行可并行的探索或实现 = 违规。HOW → Read parallel-protocol.md。
    - "[POST] Read ~/.claude/plugins/marketplaces/ace-local/shared/verification-protocol.md 验证 Spec-Code 一致性"

  archive: []
