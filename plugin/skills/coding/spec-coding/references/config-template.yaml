# ACE 框架项目级配置
# 位置：$PROJECT_ROOT/.ace/config.yaml
# 所有 ACE skill 共享此配置

spec-coding:
  # 协作模式
  # auto — 跳过所有人工交互（澄清、对齐、审批），AI 全自主
  # manual — 完整的人工澄清 + 对齐 + 审批流程
  mode: manual

  # 实施完成后是否自动执行归档流程（Phase 6），不等用户确认
  # true: apply 完成 → 直接进入 Phase 6 归档（复盘 + openspec archive + 经验提取）
  # false: apply 完成 → 等用户确认后再归档
  auto_archive: false

  # 归档后是否自动提交代码到远程仓库（git commit + git push）
  # true: 归档完成 → 自动 commit 所有变更 + push 到远程
  # false: 归档完成 → 问用户选择分支处理方式（合并/PR/保持）
  auto_push: false

  # Phase 5 执行时是否使用子代理
  # true: invoke /subagent-execute（隔离子代理 + 双重审查）
  # false: direct 模式（主代理直接执行，无审查）
  use_subagent: true
